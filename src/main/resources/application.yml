spring:
  application:
    name: saryom-ride-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saryom?currentSchema=rides&options=-c%20search_path%3Drides}
    username: ${DB_USER:saryom_rides}
    password: ${DB_PASSWORD:saryom_rides_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: rides
  flyway:
    enabled: true
    schemas: rides
    default-schema: rides
  cloud:
    stream:
      bindings:
        ride.posted:
          destination: ride.posted
        ride.booked:
          destination: ride.booked
        ride.cancelled:
          destination: ride.cancelled
        ride.booking_cancelled:
          destination: ride.booking_cancelled
        ride.completed:
          destination: ride.completed
        ride.changed:
          destination: ride.changed
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:19092}
          # Carry the W3C traceparent through Kafka headers so the consumer's work joins
          # the publisher's trace. Off by default in the Kafka binder; the RabbitMQ binder
          # (used in production) already does this whenever tracing is on.
          enable-observation: true

server:
  port: ${PORT:8087}

saryom:
  rides:
    # How long after departure a ride is left alone before the service closes
    # it. Trips run late, and a driver marking their own trip complete an hour
    # after setting off should not find the service already did it.
    close-grace-hours: ${RIDE_CLOSE_GRACE_HOURS:24}
    # Fixed delay between sweeps; runs never overlap.
    sweep-interval-ms: ${RIDE_SWEEP_INTERVAL_MS:900000}
    # Let the instance finish starting before the first sweep.
    sweep-initial-delay-ms: ${RIDE_SWEEP_INITIAL_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Observability: metrics, traces and logs over OTLP to Grafana Cloud's free
  # tier (or any OTLP backend). Off unless OTLP_ENABLED=true, so local runs,
  # tests and the Docker build never try to reach a collector. Setup and the
  # env vars to set: saryom-api-gateway/docs/observability.md.
  tracing:
    sampling:
      # Traffic is low, so keep every trace. Lower it if the free tier fills up.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: ${OTLP_AUTH_HEADER:}
        # One data point per series per minute, the free tier's included rate.
        step: 60s
        # Prometheus convention, and what the committed dashboard queries.
        base-time-unit: seconds
  opentelemetry:
    resource-attributes:
      service.namespace: saryom
      deployment.environment.name: ${DEPLOY_ENV:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          headers:
            Authorization: ${OTLP_AUTH_HEADER:}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
          headers:
            Authorization: ${OTLP_AUTH_HEADER:}
  metrics:
    distribution:
      # A handful of fixed latency buckets, enough for p50/p95/p99 panels and
      # alerts. The defaults would add ~70 series per endpoint and use up the
      # free tier's 10k series. 30s and 60s catch Render cold starts.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  observations:
    enable:
      # Spring Security wraps every request in a dozen filter-chain spans;
      # they bury the spans that matter and use up the trace allowance.
      spring.security: false

---
spring:
  config:
    activate:
      on-profile: kafka
  cloud:
    stream:
      default-binder: kafka
---
spring:
  config:
    activate:
      on-profile: rabbit
  cloud:
    stream:
      default-binder: rabbit
  rabbitmq:
    addresses: ${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
