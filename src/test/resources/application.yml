spring:
  datasource:
    url: jdbc:h2:mem:rides;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  cloud:
    stream:
      default-binder: test
